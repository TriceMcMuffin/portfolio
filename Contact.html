<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Film Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            color: #eee;
            line-height: 1.6;

            background:
                radial-gradient(circle at 20% 30%, rgba(255, 120, 40, 0.35), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(180, 70, 20, 0.35), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(120, 40, 10, 0.25), transparent 50%),
                linear-gradient(180deg, #000 0%, #120600 100%);
        }

        header {
            width: 100%;
            height: 80px;
            background-color: #000;
            color: white;
            padding: 20px;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.6);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .nav-link {
            font-size: 18px;
            color: #fff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #ff8c42;
        }

        /* Contact Form */
        #contact-form {
            width: 70%;
            max-width: 700px;
            margin: 100px auto;
            padding: 50px;
            background-color: rgba(0, 0, 0, 0.75);
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            border: 1px solid rgba(255, 140, 66, 0.35);
        }

        #contact-form h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        #contact-form p {
            color: #ccc;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 6px;
            color: #ddd;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: #111;
            color: #eee;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff8c42;
        }

        .form-group textarea {
            resize: vertical;
        }

        .form-group input[type="submit"] {
            background-color: #ff8c42;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .form-group input[type="submit"]:hover {
            background-color: #ffa76a;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<header>
    <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About Me</a>
        <a href="projects.html" class="nav-link">Projects</a>
		<a href="mymovie.html" class="nav-link">My Movie</a>
        <a href="contact.html" class="nav-link">Contact Me</a>
    </nav>
</header>

<!-- Contact Form Section -->
<section id="contact-form">
    <h2>Contact Me</h2>
    <p>Feel free to reach out with any questions or projects you'd like to discuss. I'm here to help!</p>

    <form action="#" method="post">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
        </div>

        <div class="form-group">
            <input type="submit" value="Send Message">
        </div>
    </form>
</section>

</body>
</html>
