<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie - Film Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            color: #eee;
            line-height: 1.6;

            background:
                radial-gradient(circle at 20% 30%, rgba(255, 120, 40, 0.35), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(180, 70, 20, 0.35), transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(120, 40, 10, 0.25), transparent 50%),
                linear-gradient(180deg, #000 0%, #120600 100%);
        }

        header {
            width: 100%;
            height: 80px;
            background-color: #000;
            color: white;
            padding: 20px;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.6);
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .nav-link {
            font-size: 18px;
            color: #fff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #ff8c42;
        }

        /* Page Section */
        .page-section {
            min-height: 600px;
            padding: 100px 10%;
            text-align: center;
        }

        .page-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .page-content {
            max-width: 1000px;
            margin: auto;
            font-size: 18px;
            color: #ccc;
        }

        /* Video Container (Responsive) */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            margin-top: 40px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 140, 66, 0.4);
            background: #000;
        }

        .video-container video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
}


        footer {
            margin-top: 80px;
            padding: 20px;
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About Me</a>
        <a href="projects.html" class="nav-link">Projects</a>
        <a href="mymovie.html" class="nav-link">My Movie</a>
        <a href="contact.html" class="nav-link">Contact Me</a>
    </nav>
</header>

<!-- My Movie Section -->
<section class="page-section">
    <h1 class="page-title">My Movie</h1>

    <div class="page-content">

    <!-- Local Movie Player -->
<div class="video-container">
    <video controls preload="metadata">
        <source src="mymovie.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>



        <!-- Optional description -->
        <p style="margin-top: 30px;">
            This isn't the movie I'm making, this is just a placeholder until I finish my summer project.
        </p>

    </div>
</section>

<footer>
    <p>&copy; 2026 Film Student Portfolio</p>
</footer>

</body>
</html>
